<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2cf"><meta name="description" content="Ad-free trilingual preschool learning games"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Little Genius Kids</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans Gujarati','Noto Sans Devanagari',sans-serif;color:#26345b;background:#fff2cf}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#fff0bd,#e6f6ff)}main{max-width:650px;margin:auto;padding:18px 15px 42px;text-align:center}h1{font-size:clamp(25px,7vw,38px);margin:8px 0}p{margin:8px 0 18px}.panel{background:#fff;border-radius:25px;padding:20px 14px;box-shadow:0 8px 24px #4c64801c;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}button{border:0;border-radius:18px;min-height:64px;padding:12px 8px;font-size:19px;font-weight:750;background:#dfeeff;color:#243b6b;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:4px solid #f59e0b}button:active{transform:scale(.97)}.lang{font-size:16px;min-height:62px}.selected{background:#3468dd;color:white}.category{background:#e8f7ec}.emoji{display:block;font-size:40px;margin-bottom:7px}.answer{min-height:105px;background:#f4f7ff;font-size:32px;overflow-wrap:anywhere}.answer.correct{background:#bbf7d0}.answer.wrong{background:#ffe4e6}.small{min-height:44px;font-size:15px;padding:9px 14px}.primary{background:#356be8;color:white}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{font-size:clamp(23px,6vw,32px);margin:12px 0 18px}.feedback{font-size:21px;font-weight:800;min-height:36px;margin-top:14px}.muted{color:#64748b;font-size:13px}.pill{background:#fff1ad;border-radius:18px;padding:8px 12px;font-weight:800}#speech{background:#e8e7ff}#menu button{min-height:110px}#answers button{line-height:1.3}.symbol{font-size:64px;min-height:84px}footer{font-size:12px;color:#58627b;margin-top:20px}@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}} </style></head><body><main><h1>🌈 Little Genius Kids</h1><p id="subtitle">Learn • Play • Grow</p><section class="panel" id="language-screen"><h2 id="choose-title">Choose your language</h2><div class="langs"><button class="lang selected" data-lang="en">English</button><button class="lang" data-lang="gu">ગુજરાતી</button><button class="lang" data-lang="hi">हिन्दी</button></div><p class="muted" id="lang-note">You can change language at any time.</p><button class="primary" id="begin">Let's Play! ▶</button></section><section class="panel hidden" id="menu"><div class="row"><button class="small" id="change-lang">🌍 Language</button><span class="pill">⭐ <span id="stars-menu">0</span></span></div><h2 id="pick-title">Choose a game</h2><div class="grid" id="categories"></div></section><section class="panel hidden" id="game"><div class="row"><button class="small" id="back">← Games</button><span class="pill">⭐ <span id="stars">0</span></span><span id="progress" class="muted"></span></div><div id="symbol" class="symbol" aria-hidden="true"></div><h2 class="question" id="question"></h2><button class="small" id="speech">🔊 Listen</button><div class="grid" id="answers" style="margin-top:18px"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="primary hidden">Next ➜</button></section><footer>No ads • No accounts • Designed for little learners</footer></main><script src="./app.js" defer></script></body></html>
